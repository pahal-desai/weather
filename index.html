<html>

<head>
    <title>Weather</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>

<body>
    <div class="weather">
        <div class="city">
            <input id='city' type="text" placeholder="Enter city name" spellcheck="false">
            <button id="button">Search</button>
        </div>
        <div class="temp">
            <span>0°C</span>
        </div>
        <div class="condition">Clear Sky</div>
    </div>
</body>

</html>
